name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  check-bib:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: hub.cs.upb.de
          username: ${{ vars.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
      - name: Check file
        run: docker run --name=biber -v ./data:/data -e BIB_FILE=/data/bib/dice.bib hub.cs.upb.de/ag-ngonga/biber-image
      # Check according to https://timheuer.com/blog/manually-force-a-failure-in-github-action-step/
      - name: Collect test result
        id: collect
        shell: pwsh
        run: $result = docker wait biber
      - name: Check test result
        if: ${{ steps.collect.outputs.result > 0 }}
        uses: actions/github-script@v3
        with:
          script: |
            core.setFailed('Biber detected an error in the bib file')
  upload-bib:
    needs: check-bib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Download uploader
        run: curl --retry 4 -L -o "bibupload_18.jar" "https://github.com/dice-group/bibsonomy-uploader/releases/download/v1.0.0/bibsonomy_uploader.jar"
      - name: Upload
        shell: bash
        env:
          BIBSONOMY_SECRET: ${{ secrets.BIBSONOMY_API_TOKEN }}
        run: java -jar bibupload_18.jar dice-research "$BIBSONOMY_SECRET" "http://www.bibsonomy.org/api" data/bib/dice.bib
  deploy:
    concurrency:
      group: dice-website-production
      cancel-in-progress: false
    needs: upload-bib
    runs-on: ubuntu-22.04
    env:
      BIBSONOMY_USER: ${{ vars.BIBSONOMY_USER }}
      BIBSONOMY_API_TOKEN: ${{ secrets.BIBSONOMY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Use Node.js 14 (build)
        uses: actions/setup-node@v4
        with:
          node-version: '14'
      - name: configure DNS server
        run: |
          sudo mkdir /usr/lib/systemd/resolved.conf.d
          echo "[Resolve]" > resolved.conf
          echo "DNS=8.8.8.8" >> resolved.conf
          sudo mv resolved.conf /usr/lib/systemd/resolved.conf.d/resolved.conf
          sudo systemctl daemon-reload
          sudo systemctl restart systemd-networkd
          sudo systemctl restart systemd-resolved
      - name: install and lint
        working-directory: ./scripts
        run: |
          npm install
          npm run lint
      - name: update papers
        working-directory: ./scripts
        run: |
          rm ../data/**/_Example.ttl
          npm run papers
      - name: 'build (runs prebuild: fetch LinkedIn posts)'
        working-directory: ./scripts
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: '88654324'
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION}}
          GATSBY_RAG_API_URL: /api/rag
          GATSBY_LINKEDIN_CLIENT_ID: ${{ vars.LINKEDIN_CLIENT_ID }}
        run: npm run build
      - name: prepare deploy
        working-directory: ./scripts
        run: |
          cp exoframe.json public/
          cp Dockerfile public/
      - name: Use Node.js 22 (deploy tooling)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare RAG deployment
        env:
          RAG_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          RAG_PDF_STRICT: ${{ vars.RAG_PDF_STRICT }}
          RAG_EMBEDDING_MODEL: ${{ vars.RAG_EMBEDDING_MODEL }}
          RAG_EMBEDDING_REVISION: ${{ vars.RAG_EMBEDDING_REVISION }}
          RAG_QDRANT_URL: ${{ vars.RAG_QDRANT_URL }}
          RAG_QDRANT_COLLECTION: ${{ vars.RAG_QDRANT_COLLECTION }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: node scripts/rag/prepare-deploy.mjs "$RUNNER_TEMP/dice-rag-deploy"
      - name: Deploy RAG API
        working-directory: ${{ runner.temp }}/dice-rag-deploy
        env:
          EXO_TOKEN_DICE: ${{ secrets.EXO_TOKEN_DICE }}
        run: npx -y exoframe@6.2.0 -u -e https://dice-website.cs.upb.de -t "$EXO_TOKEN_DICE"
      - name: Remove temporary RAG credentials
        if: always()
        run: |
          node -e 'require("node:fs").rmSync(require("node:path").join(process.env.RUNNER_TEMP, "dice-rag-deploy", "exoframe.json"), { force: true })'
      - name: Wait for RAG readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 https://dice-research.org/api/rag/health; then
              exit 0
            fi
            sleep 10
          done
          echo "RAG API did not become ready" >&2
          exit 1
      - name: deploy
        working-directory: ./scripts/public
        run: npx -y exoframe@6.2.0 -u -vvv -e https://dice-website.cs.upb.de -t "$EXO_TOKEN_DICE"
        env:
          EXO_TOKEN_DICE: ${{ secrets.EXO_TOKEN_DICE }}
      - name: Report paper PDF ingestion
        env:
          RAG_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/rag/wait-ingestion.mjs
  syncBranches:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: merge master to develop
        run: |
          git config --global user.email "bot@dice-research.org"
          git config --global user.name "DICE Bot"
          git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY
          git checkout develop
          git merge origin/master
          git push origin develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  uploadData:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BIBSONOMY_USER: ${{ vars.BIBSONOMY_USER }}
      BIBSONOMY_API_TOKEN: ${{ secrets.BIBSONOMY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v1
        with:
          ref: master
      - name: Use Node.js 14
        uses: actions/setup-node@v1
        with:
          node-version: 14
      - name: configure DNS server
        run: |
          sudo mkdir /usr/lib/systemd/resolved.conf.d
          echo "[Resolve]" > resolved.conf
          echo "DNS=8.8.8.8" >> resolved.conf
          sudo mv resolved.conf /usr/lib/systemd/resolved.conf.d/resolved.conf
          sudo systemctl daemon-reload
          sudo systemctl restart systemd-networkd
          sudo systemctl restart systemd-resolved
      - name: install and lint
        working-directory: ./scripts
        run: |
          npm install
          npm run lint
      - name: update papers
        working-directory: ./scripts
        run: |
          rm ../data/**/_Example.ttl
          npm run papers
      - name: collect RDF data
        run: cat `find . -name "*.ttl" | grep -v "_Example.ttl"` > data.ttl
      - name: upload to FTP
        uses: tomasbkk/action-ftp-upload@v1.2
        with:
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          host: ${{ secrets.FTP_HOST }}
          src: data.ttl
          dest: public/website/data/data.ttl
          secure: true
          rejectUnauthorized: false
