services:
  rag:
    build:
      context: .
      dockerfile: scripts/rag/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - '8787:8787'
    environment:
      LLM_API_KEY: ${DICE_LLM_API_KEY:-${LLM_API_KEY:?Set DICE_LLM_API_KEY or LLM_API_KEY}}
      LLM_MODEL: ${LLM_MODEL:-general-purpose}
      LLM_BASE_URL: ${DICE_LLM_BASE_URL:-${LLM_BASE_URL:-https://dice-llm-api.cs.uni-paderborn.de/v1}}
      QDRANT_URL: ${QDRANT_URL:-http://host.docker.internal:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-dice_rag}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - rag-model-cache:/app/model-cache

volumes:
  rag-model-cache:
