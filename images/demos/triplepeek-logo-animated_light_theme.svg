<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1516" height="326.45" viewBox="267 169 1516 326.45">
<title>TriplePeek — editable vector logo</title>
<desc>Reconstructed vector artwork. Each icon panel, Triple, and Peek occupy separate editable layers. Transparent background; canvas cropped to artwork bounds. Wordmark letters are paths, requiring no fonts.</desc>
<defs>
<linearGradient id="navy" x1="267" y1="210" x2="359" y2="495" gradientUnits="userSpaceOnUse"><stop stop-color="#083b6c"/><stop offset="1" stop-color="#073967"/></linearGradient>
<linearGradient id="blue" x1="359" y1="170" x2="466" y2="491" gradientUnits="userSpaceOnUse"><stop stop-color="#009dff"/><stop offset="1" stop-color="#008ff0"/></linearGradient>
<linearGradient id="teal" x1="491" y1="205" x2="571" y2="438" gradientUnits="userSpaceOnUse"><stop stop-color="#00bca9"/><stop offset="1" stop-color="#00b5a6"/></linearGradient>
<linearGradient id="peek-color" x1="1230" y1="348" x2="1783" y2="348" gradientUnits="userSpaceOnUse"><stop stop-color="#009af7"/><stop offset="0.42" stop-color="#00a9ed"/><stop offset="1" stop-color="#00bda9"/></linearGradient>

<style>
  /* GitHub-safe SVG/CSS animation: no JavaScript. */
  #panel-left, #panel-middle, #panel-right {
    transform-box: fill-box;
    transform-origin: center;
    animation: panel-in 3.8s ease-in-out infinite;
  }
  #panel-middle { animation-delay: .16s; }
  #panel-right  { animation-delay: .32s; }

  #P-dot {
    transform-box: fill-box;
    transform-origin: center;
    animation: peek-pulse 3.8s ease-in-out infinite;
  }

  #peek {
    animation: peek-glow 3.8s ease-in-out infinite;
  }

  @keyframes panel-in {
    0%, 8%   { opacity: .35; transform: translateY(7px) scale(.96); }
    22%, 72% { opacity: 1; transform: translateY(0) scale(1); }
    88%,100% { opacity: .82; transform: translateY(0) scale(1); }
  }

  @keyframes peek-pulse {
    0%, 38%, 100% { transform: scale(1); opacity: 1; }
    48%           { transform: scale(1.28); opacity: .72; }
    58%           { transform: scale(1); opacity: 1; }
  }

  @keyframes peek-glow {
    0%, 32%, 100% { opacity: .92; }
    50%, 72%      { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    #panel-left, #panel-middle, #panel-right, #P-dot, #peek {
      animation: none !important;
    }
  }
</style>
</defs>
